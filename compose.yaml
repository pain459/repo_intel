# repo_intel — Compose for development and production
# Usage: HOST_REPO_ROOT=/path/to/your/repo docker compose up -d --build

# ------------------------------------------------------------------
# API (FastAPI + health)
# ------------------------------------------------------------------
services:
  api:
    build: .
    command: ["repo-intel", "serve"]
    env_file: .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ${HOST_REPO_ROOT:-.}/:/workspace:ro
      - /Users/ravik/src_git/TencentDB-Agent-Memory:/repos/agent-memory:ro
      - /Users/ravik/src_git/rea:/repos/rea:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8765/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Resource limits to prevent runaway memory/CPU usage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

# ------------------------------------------------------------------
# Worker (background jobs — Phase 2+)
# ------------------------------------------------------------------
  worker:
    build: .
    command: ["repo-intel", "worker"]
    env_file: .env
    volumes:
      - ${HOST_REPO_ROOT:-.}/:/workspace:ro
      - /Users/ravik/src_git/TencentDB-Agent-Memory:/repos/agent-memory:ro
      - /Users/ravik/src_git/rea:/repos/rea:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Resource limits to prevent runaway memory/CPU usage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

# ------------------------------------------------------------------
# PostgreSQL + pgvector
# ------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: repo_intel
      POSTGRES_USER: repo_intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_intel -d repo_intel"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Resource limits for the database
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  pgdata:
