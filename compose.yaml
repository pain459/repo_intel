# repo_intel — Compose for development and production
# Usage: HOST_REPO_ROOT=/path/to/your/repo docker compose up -d --build

# ------------------------------------------------------------------
# API (FastAPI + health)
# ------------------------------------------------------------------
services:
  api:
    build: .
    command: ["repo-intel", "serve"]
    env_file: .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ${HOST_REPO_ROOT:-.}/:/workspace:ro
      - /Users/ravik/src_git/TencentDB-Agent-Memory:/repos/agent-memory:ro
      - /Users/ravik/src_git/rea:/repos/rea:ro
      - /Users/ravik/src_git/httpx:/repos/httpx:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8765/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Resource limits to prevent runaway memory/CPU usage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

# ------------------------------------------------------------------
# Worker (background jobs — Phase 2+)
# ------------------------------------------------------------------
  worker:
    build: .
    command: ["repo-intel", "worker"]
    env_file: .env
    volumes:
      - ${HOST_REPO_ROOT:-.}/:/workspace:ro
      - /Users/ravik/src_git/TencentDB-Agent-Memory:/repos/agent-memory:ro
      - /Users/ravik/src_git/rea:/repos/rea:ro
      - /Users/ravik/src_git/httpx:/repos/httpx:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Resource limits to prevent runaway memory/CPU usage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

# ------------------------------------------------------------------
# PostgreSQL + pgvector
# ------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: repo_intel
      POSTGRES_USER: repo_intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_intel -d repo_intel"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Resource limits for the database
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

# ------------------------------------------------------------------
# Prometheus (metrics scraping)
# ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

# ------------------------------------------------------------------
# Grafana (dashboards + alerting)
# ------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./monitoring/dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./monitoring/dashboard-repo-intel.json:/etc/grafana/provisioning/dashboards/dashboard-repo-intel.json:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

volumes:
  pgdata:
  promdata:
  grafanadata:
