[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "repo-intel"
version = "0.1.0"
description = "Local-first repository intelligence for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
]

[project.scripts]
repo-intel = "repo_intel.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "PROJECT_PLAN.md", "README.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/repo_intel"]
